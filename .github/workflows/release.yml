name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: launcher-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release version and main history
        id: version
        shell: pwsh
        run: |
          $match = [regex]::Match((Get-Content version.properties -Raw), '(?m)^version=((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))\s*$')
          if (-not $match.Success) { throw 'Invalid version.properties' }
          $version = $match.Groups[1].Value
          $tag = "v$version"
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') { throw 'Run this workflow on main' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and version.properties must match' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release commit must belong to main' }
          $commit = (git rev-parse HEAD).Trim()
          $refs = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read existing release tag' }
          if ($refs.Count -gt 0) {
            $existing = (($refs | Select-Object -Last 1) -split '\s+')[0]
            if ($existing -ne $commit) { throw 'Tag already points to another commit; increment the version' }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path "docs/releases/$tag.md" -PathType Leaf)) { throw 'Write the version changelog under docs/releases before publishing' }
      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $compiler) { throw 'Inno Setup compiler not found' }
          "ISCC_EXE=$compiler" >> $env:GITHUB_ENV
      - name: Compile and package Java runtime with launcher
        env:
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: .\gradlew.bat clean releaseWindows -x test --no-daemon
      - name: Check package contents and checksum
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          @('GameLauncher.exe', 'runtime/bin/java.exe', 'app/GameLauncher.cfg', 'launcher-release.properties') | ForEach-Object {
            if (-not (Test-Path "build/package/GameLauncher/$_" -PathType Leaf)) { throw "Package file missing: $_" }
          }
          $installer = "build/releases/GameLauncher-$env:RELEASE_VERSION-windows-x64-setup.exe"
          if (-not (Test-Path $installer -PathType Leaf)) { throw 'Installer EXE missing' }
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ((Get-Content "$installer.sha256" -Raw).Trim() -split '\s+')[0]
          if ($actual -ne $expected) { throw 'Release checksum mismatch' }
          if (Get-ChildItem build/releases/*.zip -ErrorAction SilentlyContinue) { throw 'ZIP distributions are not published' }
          Copy-Item "docs/releases/v$env:RELEASE_VERSION.md" build/releases/CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-release
          path: build/releases/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher-release
          path: release
      - name: Publish complete stable release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c -- *.sha256
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > existing.json 2>/dev/null; then
            jq -e --arg sha "$RELEASE_COMMIT" '.isDraft == true and .targetCommitish == $sha' existing.json > /dev/null || {
              echo 'Published releases are immutable; increment version.properties for a new release.'
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
          gh release upload "$RELEASE_TAG" "GameLauncher-$RELEASE_VERSION-windows-x64-setup.exe" "GameLauncher-$RELEASE_VERSION-windows-x64-setup.exe.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "$RELEASE_TAG" --notes-file CHANGELOG.md
