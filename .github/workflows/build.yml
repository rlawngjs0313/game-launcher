name: Compile Windows launcher
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: .\gradlew.bat build -x test packageWindows --no-daemon
        env:
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: GameLauncher-windows-x64
          path: build/package/GameLauncher/
